name: Release

# Manual only, deliberately.
#
# npm requires a second factor to publish, and this account has no automation
# token stored — so a tag-triggered publish would fail at the last step every
# time, putting a red cross beside a release whose installers built perfectly.
# Tags build installers (see desktop.yml); packages are published on purpose.
#
# To go back to publishing on a tag: add an npm automation token as the
# NPM_TOKEN secret and restore `push: tags: ["v*"]` here.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # `build:all`, never `build`. packages/ui/dist is gitignored and built by
      # Vite, and @ctxd/api resolves the interface at ../../ui/dist — publishing
      # without this step ships a package whose `ctxd ui` serves nothing.
      - name: Build core packages and the interface
        run: pnpm build:all

      - name: Regenerate fixtures
        run: |
          node --experimental-strip-types scripts/generate-fixture.ts
          node --experimental-strip-types scripts/generate-benchmarks.ts
          node --experimental-strip-types scripts/generate-benchmarks-2.ts

      # A release that skipped the suite would be a release nobody checked.
      - name: Test
        run: pnpm test

      - name: Verify the interface bundle exists
        run: |
          set -euo pipefail
          test -f packages/ui/dist/index.html
          ls packages/ui/dist/assets/*.js >/dev/null
          echo "interface bundle present"

      # Every package must carry the same version. A partial bump publishes a
      # set that cannot be installed together, and npm will not let it be
      # taken back.
      - name: Check every package agrees on the version
        run: |
          set -euo pipefail
          versions="$(node -e "
            const {readdirSync,readFileSync,existsSync}=require('fs');
            const seen=new Set();
            for (const dir of readdirSync('packages')) {
              const path='packages/'+dir+'/package.json';
              if (!existsSync(path)) continue;
              seen.add(JSON.parse(readFileSync(path,'utf8')).version);
            }
            console.log([...seen].join(' '));
          ")"
          if [ "$(echo "$versions" | wc -w)" -ne 1 ]; then
            echo "::error::packages disagree on the version: $versions"
            exit 1
          fi
          echo "every package is at $versions"

      - name: Pack every package (dry run)
        run: pnpm -r --filter "!ctxd-workspace" exec npm pack --dry-run

      # Only when explicitly asked for. `dry_run` defaults to true so the
      # careless path is the safe one: a publish claims version numbers that
      # cannot be taken back.
      - name: Publish
        if: inputs.dry_run == false
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
