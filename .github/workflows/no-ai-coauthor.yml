name: No AI co-author

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  trailers:
    name: Scan commit trailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full range to inspect every commit being introduced.
          fetch-depth: 0

      - name: Reject AI co-author trailers
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git fetch --no-tags origin "${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~20..HEAD"
          fi

          echo "Scanning $range"

          # Attribution belongs to the person who takes responsibility for the
          # change. Tools do not co-author commits.
          pattern='(Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|chatgpt|gpt-[0-9]|openai|cursor|codeium|devin|gemini|bard|llama|sourcegraph|cody|tabnine|aider|windsurf))|(Generated with \[?(Claude|Cursor|Copilot))|(🤖 Generated)'

          found=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if git log -1 --format='%B' "$sha" | grep -Eiq "$pattern"; then
              echo "::error::Commit $sha contains an AI attribution trailer."
              git log -1 --format='  %h %s' "$sha"
              git log -1 --format='%B' "$sha" | grep -Ei "$pattern" | sed 's/^/    /'
              found=1
            fi
          done < <(git rev-list "$range" 2>/dev/null || true)

          if [ "$found" -ne 0 ]; then
            echo ""
            echo "Remove the trailer and amend, for example:"
            echo "  git commit --amend"
            echo "  git rebase -i <base>   # for older commits"
            exit 1
          fi

          echo "No AI attribution trailers found."
