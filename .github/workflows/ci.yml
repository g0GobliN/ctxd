name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fixture .env files are gitignored on purpose; regenerate them so the
      # "never collects secrets" assertion has a secret to find.
      - run: node --experimental-strip-types scripts/generate-fixture.ts
      - run: node --experimental-strip-types scripts/generate-benchmarks.ts
      - run: node --experimental-strip-types scripts/generate-benchmarks-2.ts
      - run: pnpm test

  benchmark:
    name: Golden benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --experimental-strip-types scripts/generate-fixture.ts
      - run: node --experimental-strip-types scripts/generate-benchmarks.ts
      - run: node --experimental-strip-types scripts/generate-benchmarks-2.ts
      # Retrieval quality is a product requirement, not a nice-to-have:
      # a regression here fails the build.
      - name: Run the golden benchmark
        run: node --test --experimental-strip-types tests/integration/golden-benchmark.test.ts

  doctor:
    name: Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every check must actually pass on a clean machine.
      - run: node packages/cli/dist/index.js doctor

  no-network:
    name: No network calls in core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the core makes no outbound calls
        run: |
          set -euo pipefail
          # The context engine, memory and storage layers are local-first by
          # design. The MCP package is exempt: it speaks a protocol on stdio.
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket)\s*\(|from "node:(http|https|net|dgram|tls)"' \
              packages/context/src packages/core/src packages/db/src \
              packages/memory/src packages/project/src packages/work/src \
              packages/firewall/src packages/diff/src packages/verify/src \
              packages/stats/src packages/ai/src; then
            echo "::error::Found a network primitive in a local-first package."
            exit 1
          fi
          echo "No network primitives in the local-first packages."

  no-mcp-execution:
    name: No shell execution through MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert workers cannot run commands
        run: |
          set -euo pipefail
          # §63: ctxd never exposes arbitrary shell execution to a worker.
          # Controlled execution exists, but it lives in @ctxd/verify behind the
          # CLI and is deliberately unreachable from the MCP surface.
          if grep -rnE 'from "node:child_process"|\b(execSync|execFileSync|spawnSync|spawn|fork)\s*\(|\bnew Function\s*\(|\beval\s*\(' \
              packages/mcp/src; then
            echo "::error::MCP must not be able to spawn a process."
            exit 1
          fi
          if grep -qE '"@ctxd/verify"' packages/mcp/package.json; then
            echo "::error::MCP must not depend on @ctxd/verify."
            exit 1
          fi
          echo "MCP exposes no execution capability."

  ci:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [build, typecheck, test, benchmark, doctor, no-network, no-mcp-execution]
    steps:
      - run: echo "All checks passed."
